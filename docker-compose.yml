# Public v5 testnet. Separate project/volumes from historical v3 sandboxes.
name: constella-testnet-v5
x-runtime: &runtime
  restart: unless-stopped
  stop_grace_period: 60s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
services:
  node:
    <<: *runtime
    image: constella-node:v0.1.0-rc.1
    build:
      context: .
      args: {VCS_REF: '${VCS_REF:-unknown}', VERSION: '0.1.0-rc.1'}
    cpus: 0.50
    mem_limit: 512m
    pids_limit: 32
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    environment:
      CONSTELLA_DATA: /data
      CONSTELLA_PORT: '7043'
      CONSTELLA_MINE: '0'
      CONSTELLA_PRIVATE_NET: '0'
      CONSTELLA_PEERS: '${NODE_PEERS:-explorer.catasterism.xyz:7043}'
      CONSTELLA_ADVERTISE: '${NODE_ADVERTISE:-}'
    ports: ['${P2P_BIND:-127.0.0.1}:${P2P_PORT:-7043}:7043']
    volumes: [node-data:/data]
    networks: [p2p]
  postgres:
    <<: *runtime
    profiles: [explorer]
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    cpus: 0.25
    mem_limit: 384m
    pids_limit: 128
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: constella
      POSTGRES_DB: explorer_v5
      POSTGRES_PASSWORD: '${TESTNET_DB_PASSWORD:-}'
    command: [postgres, -c, max_connections=40, -c, shared_buffers=64MB]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U constella -d explorer_v5']
      interval: 3s
      timeout: 3s
      retries: 30
  explorer:
    <<: *runtime
    profiles: [explorer]
    image: constella-explorer:v0.1.0-rc.1
    build:
      context: .
      dockerfile: explorer/Dockerfile
      args: {VCS_REF: '${VCS_REF:-unknown}', VERSION: '0.1.0-rc.1'}
    cpus: 0.50
    mem_limit: '${EXPLORER_MEMORY:-1536m}'
    memswap_limit: '${EXPLORER_MEMORY_SWAP:-2176m}'
    pids_limit: 128
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    environment:
      EXPLORER_NODE: node:7043
      EXPLORER_DB: 'postgres://constella:${TESTNET_DB_PASSWORD:-}@postgres:5432/explorer_v5?sslmode=disable'
      EXPLORER_HTTP: ':3071'
    ports: ['127.0.0.1:${EXPLORER_HTTP_PORT:-3071}:3071']
    depends_on:
      postgres: {condition: service_healthy}
      node: {condition: service_started}
    networks: [p2p, database]
networks:
  p2p: {}
  database: {internal: true}
volumes:
  node-data: {}
  pgdata: {}
