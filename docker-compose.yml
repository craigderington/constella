# Local 5-node testnet + explorer. Published on localhost only:
#   node1 P2P 7043, explorer http://127.0.0.1:3071, postgres 5439.
# Each node generates its own key in its volume (/data/wallet.key).
#   docker compose up --build -d && docker compose logs -f
#   docker compose exec node1 /constella wallet addr /data/wallet.key
x-node: &node
  image: constella:dev
  restart: unless-stopped
  cpus: 1.0
  networks: [constella]

x-env: &env
  CONSTELLA_PORT: "7043"
  CONSTELLA_THREADS: "2"
  CONSTELLA_DUTY: "50"
  CONSTELLA_BATTERY_PAUSE: "1"

services:
  node1:
    <<: *node
    build: .
    ports: ["127.0.0.1:7043:7043"]
    # CONSTELLA_ADVERTISE exercises the self-advertisement parse/resolve path
    # (Task 10). node1:7043 resolves inside the compose network but lands on
    # a container-private address, which addr_is_routable correctly refuses
    # to store or gossip - this is here to prove the code path runs cleanly
    # end to end, not to demonstrate real inbound reachability, which needs
    # a publicly routable address.
    environment: { <<: *env, CONSTELLA_ADVERTISE: "node1:7043" }
    volumes: [node1:/data]
  node2:
    <<: *node
    depends_on: [node1]
    environment: { <<: *env, CONSTELLA_PEERS: "node1:7043" }
    volumes: [node2:/data]
  node3:
    <<: *node
    depends_on: [node1]
    environment: { <<: *env, CONSTELLA_PEERS: "node1:7043,node2:7043" }
    volumes: [node3:/data]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Override EXPLORER_DB together with these values when using non-default
    # credentials; the DSN must contain a URL-encoded password.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-constella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-constella}
      POSTGRES_DB: ${POSTGRES_DB:-explorer}
    ports: ["127.0.0.1:5439:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [explorer-ui]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constella -d explorer"]
      interval: 3s
      timeout: 3s
      retries: 20

  explorer:
    # Build context is the repo root, not ./explorer: the params.h drift
    # guard needs src/params.h and src/science.h reachable inside the image
    # (see explorer/Dockerfile). Building from ./explorer alone left those
    # headers unreachable and the guard silently skipped in the shipped build.
    build:
      context: .
      dockerfile: explorer/Dockerfile
    image: constella-explorer:dev
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      EXPLORER_NODE: node1:7043
      EXPLORER_DB: ${EXPLORER_DB:-postgres://constella:constella@postgres:5432/explorer?sslmode=disable}
      EXPLORER_HTTP: ":3071"
    ports: ["127.0.0.1:3071:3071"]
    networks: [constella, explorer-ui]

networks:
  constella: {}
  explorer-ui: {}

volumes: { node1: {}, node2: {}, node3: {}, pgdata: {} }
