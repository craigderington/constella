# Public deterministic P2P test vectors, not credentials. Match exact derived
# 32-byte values AND their test paths; never suppress entire files/rules.
[extend]
useDefault = true
[[allowlists]]
description = "Deterministic transport keys from public interoperability vectors"
condition = "AND"
regexTarget = "secret"
paths = [
  '''(^|/)tests/fixtures/network-profiles\.json$''',
  '''(^|/)explorer/internal/p2p/(transport|handshake)_test\.go$''',
]
