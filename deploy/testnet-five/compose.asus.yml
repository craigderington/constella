# Release-gate testnet: two nodes on asus-tuf-a16. Use project name
# `constella-gate-asus`; no repository checkout is required on that host.
x-node: &node
  image: constella:release-gate
  restart: unless-stopped
  cpus: 1.0
  environment: &node-env
    CONSTELLA_PORT: "7043"
    CONSTELLA_THREADS: "${GATE_THREADS:-2}"
    CONSTELLA_DUTY: "${GATE_DUTY:-50}"
    CONSTELLA_BATTERY_PAUSE: "1"
    CONSTELLA_PRIVATE_NET: "1"
    CONSTELLA_TRACE_DISCOVERY: "1"
  networks: [gate]

services:
  node4:
    <<: *node
    ports: ["${REMOTE_HOST:?set REMOTE_HOST}:17043:7043"]
    environment:
      <<: *node-env
      CONSTELLA_ADVERTISE: "${REMOTE_HOST}:17043"
      CONSTELLA_PEERS: "${LOCAL_HOST}:17045"
    volumes: [node4:/data]

  node5:
    <<: *node
    ports: ["${REMOTE_HOST:?set REMOTE_HOST}:17044:7043"]
    environment:
      <<: *node-env
      CONSTELLA_ADVERTISE: "${REMOTE_HOST}:17044"
      # Cross-host bootstrap avoids relying on Docker hairpin NAT on the ASUS.
      CONSTELLA_PEERS: "${LOCAL_HOST}:17043"
    volumes: [node5:/data]

networks:
  gate: {}

volumes:
  node4: {}
  node5: {}
