# Enable only after the named certificate exists. Do not also use certbot --apache.
<VirtualHost *:443>
    ServerName explorer.catasterism.xyz
    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/explorer.catasterism.xyz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/explorer.catasterism.xyz/privkey.pem
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 30
    ProxyPass / http://127.0.0.1:3071/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:3071/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    ErrorLog ${APACHE_LOG_DIR}/constella-error.log
    CustomLog ${APACHE_LOG_DIR}/constella-access.log combined
</VirtualHost>
