# catasterism.xyz project website. Independent of the Explorer virtual host.
<VirtualHost *:80>
    ServerName catasterism.xyz
    Alias /.well-known/acme-challenge/ /var/www/constella-acme/.well-known/acme-challenge/
    <Directory /var/www/constella-acme/.well-known/acme-challenge/>
        Require all granted
        AllowOverride None
        Options None
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://catasterism.xyz%{REQUEST_URI} [R=308,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/catasterism-error.log
    CustomLog ${APACHE_LOG_DIR}/catasterism-access.log combined
</VirtualHost>
