# Enable only after this separate apex certificate exists.
<VirtualHost *:443>
    ServerName catasterism.xyz
    DocumentRoot /var/www/catasterism/current
    DirectoryIndex index.html
    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/catasterism.xyz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/catasterism.xyz/privkey.pem
    <Directory /var/www/catasterism/>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    AddDefaultCharset UTF-8
    AddType image/svg+xml .svg
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    <FilesMatch "\.(html|xml|txt|svg)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/catasterism-error.log
    CustomLog ${APACHE_LOG_DIR}/catasterism-access.log combined
</VirtualHost>
