# Install before certificate issuance. Certbot uses webroot, not --apache.
<VirtualHost *:80>
    ServerName explorer.catasterism.xyz
    Alias /.well-known/acme-challenge/ /var/www/constella-acme/.well-known/acme-challenge/
    <Directory /var/www/constella-acme/.well-known/acme-challenge/>
        Require all granted
        AllowOverride None
        Options None
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://explorer.catasterism.xyz%{REQUEST_URI} [R=308,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/constella-error.log
    CustomLog ${APACHE_LOG_DIR}/constella-access.log combined
</VirtualHost>
