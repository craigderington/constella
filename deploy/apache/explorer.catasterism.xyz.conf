# explorer.catasterism.xyz -> the Go explorer on 127.0.0.1:3071
#
# The explorer binds loopback only. Apache is the sole public listener, so the
# Go process never needs a cert, never parses TLS, and cannot be reached except
# through this vhost.
#
# Install:
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo cp explorer.catasterism.xyz.conf /etc/apache2/sites-available/
#   sudo a2ensite explorer.catasterism.xyz
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Then let certbot add the TLS vhost (see deploy/apache/README.md). Run certbot
# BEFORE adding any HTTPS block by hand — it writes its own and will not
# overwrite yours, leaving two vhosts fighting over port 443.

<VirtualHost *:80>
    ServerName explorer.catasterism.xyz

    # Certbot's HTTP-01 challenge must reach the filesystem, not the proxy.
    # Without this exclusion every renewal fails once the redirect below exists.
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Require all granted
        Options -Indexes
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=308,L]

    ErrorLog  ${APACHE_LOG_DIR}/explorer-error.log
    CustomLog ${APACHE_LOG_DIR}/explorer-access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# The :443 vhost below is what certbot will generate for you. It is reproduced
# here as documentation of the intended final state -- do not install it as a
# second file, or Apache will serve whichever it loads first.
# ---------------------------------------------------------------------------
#
# <IfModule mod_ssl.c>
# <VirtualHost *:443>
#     ServerName explorer.catasterism.xyz
#
#     ProxyPreserveHost On
#     ProxyRequests     Off
#     ProxyTimeout      30
#
#     # Trailing slashes on both sides, or Apache mangles sub-paths.
#     ProxyPass        / http://127.0.0.1:3071/
#     ProxyPassReverse / http://127.0.0.1:3071/
#
#     # The explorer decides text vs HTML from the request; pass enough for it
#     # to tell, and enough that its logs show the real client rather than ::1.
#     RequestHeader set X-Forwarded-Proto "https"
#     RequestHeader set X-Forwarded-Port  "443"
#
#     Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
#     Header always set X-Content-Type-Options    "nosniff"
#     Header always set Referrer-Policy           "strict-origin-when-cross-origin"
#     Header always set X-Frame-Options           "SAMEORIGIN"
#
#     # A dashboard is cheap to render but the node behind it is not infinite.
#     # Raise if you put it behind a CDN; lower if it is directly exposed.
#     <Location />
#         Require all granted
#     </Location>
#
#     ErrorLog  ${APACHE_LOG_DIR}/explorer-error.log
#     CustomLog ${APACHE_LOG_DIR}/explorer-access.log combined
#
#     SSLCertificateFile    /etc/letsencrypt/live/explorer.catasterism.xyz/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/explorer.catasterism.xyz/privkey.pem
#     Include /etc/letsencrypt/options-ssl-apache.conf
# </VirtualHost>
# </IfModule>
