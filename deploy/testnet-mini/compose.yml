# Fresh sixth testnet node on the ARM Mac mini. No explorer/database services.
services:
  node6:
    image: constella:burst-fix-arm64-20261002
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 1.0
    environment:
      CONSTELLA_PORT: "7043"
      CONSTELLA_THREADS: "2"
      # Controlled second miner, enabled after its retained chain catches up.
      CONSTELLA_MINE: "1"
      CONSTELLA_DUTY: "25"
      CONSTELLA_TEMP_MAX: "80"
      # Host symlink to the real sensor file; absent during coordinated catch-up.
      CONSTELLA_TEMP_FILE: /host-thermal/mining_cpu_millidegrees
      CONSTELLA_BATTERY_PAUSE: "1"
      CONSTELLA_PRIVATE_NET: "1"
      CONSTELLA_TRACE_DISCOVERY: "1"
      CONSTELLA_ADVERTISE: "${MINI_HOST:?set MINI_HOST}:17046"
      CONSTELLA_PEERS: "3.150.62.26:7043,${LOCAL_HOST:?set LOCAL_HOST}:17043,${REMOTE_HOST:?set REMOTE_HOST}:17043"
    ports: ["${MINI_HOST}:17046:7043"]
    volumes:
      - node6:/data
      - ${HOST_THERMAL_DIR:?set HOST_THERMAL_DIR}:/host-thermal:ro
    networks: [gate]
networks:
  gate: {}
volumes:
  node6: {}
